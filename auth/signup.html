<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | TestSkyWalkers</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <main class="auth-layout">
    <section class="card auth-card">
      <h2>Create your account</h2>
      <p>Register to take SSC CGL/CHSL tests with analytics.</p>
      <form id="signupForm">
        <div class="input-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required />
        </div>
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" required />
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" required />
        </div>
        <button class="button" type="submit">Create Account</button>
        <div class="status" id="status"></div>
      </form>
      <div class="auth-links">
        Already have an account? <a href="/auth/login.html">Login</a>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-init.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/firestore.js"></script>
  <script src="/auth/auth.js"></script>
  <script>
    const form = document.getElementById("signupForm");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      ui.showStatus(status, "Creating your account...");
      try {
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        await authApi.signup({ name, email, password });
        ui.showStatus(status, "Account created! Redirecting...", "success");
        window.location.href = "/student/dashboard.html";
      } catch (error) {
        ui.showStatus(status, error.message, "error");
      }
    });
  </script>
</body>
</html>
