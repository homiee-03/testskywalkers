<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | TestSkyWalkers</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <main class="auth-layout">
    <section class="card auth-card">
      <h2>Welcome back</h2>
      <p>Log in to access SSC tests and analytics.</p>
      <form id="loginForm">
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" required />
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" required />
        </div>
        <button class="button" type="submit">Login</button>
        <div class="status" id="status"></div>
      </form>
      <div class="auth-links">
        New here? <a href="/auth/signup.html">Create an account</a>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-init.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/firestore.js"></script>
  <script src="/auth/auth.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      ui.showStatus(status, "Signing you in...");
      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const user = await authApi.login({ email, password });
        const role = await authApi.fetchRole(user.uid);
        ui.showStatus(status, "Login successful! Redirecting...", "success");
        window.location.href = role === "admin" ? "/admin/admin.html" : "/student/dashboard.html";
      } catch (error) {
        ui.showStatus(status, error.message, "error");
      }
    });
  </script>
</body>
</html>
